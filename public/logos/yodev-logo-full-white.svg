<svg width="280" height="80" viewBox="0 0 280 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dots Grid -->
  <!-- Top left - primary -->
  <rect x="0" y="0" width="35" height="35" rx="6" fill="#1BA896"/>
  <!-- Top right - primary 60% -->
  <rect x="40" y="0" width="35" height="35" rx="6" fill="#1BA896" fill-opacity="0.6"/>
  <!-- Bottom left - primary 40% -->
  <rect x="0" y="40" width="35" height="35" rx="6" fill="#1BA896" fill-opacity="0.4"/>
  <!-- Bottom right - secondary -->
  <rect x="40" y="40" width="35" height="35" rx="6" fill="#FF6B35"/>

  <!-- Text "yodev" - White version -->
  <text x="95" y="58" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-2" fill="#FFFFFF">yodev</text>
</svg>
